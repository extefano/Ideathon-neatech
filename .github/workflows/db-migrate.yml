name: Deploy DB Migrations (Supabase)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

concurrency:
  group: production-db-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Migrations (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations
        run: |
          supabase migration repair --status reverted 20261017014823 20261017014844 20261017014845 20261017015137 --db-url "$SUPABASE_DB_URL" || true
          supabase db push --include-all --db-url "$SUPABASE_DB_URL"
