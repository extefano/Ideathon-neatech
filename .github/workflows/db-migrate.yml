name: Deploy DB Migrations (Supabase)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

concurrency:
  group: production-db-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Migrations (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations (reparando huérfanas remotas si hace falta)
        run: |
          OUT=$(supabase db push --include-all --db-url "$SUPABASE_DB_URL" 2>&1) && { echo "$OUT"; exit 0; }
          echo "$OUT"
          ORPHANS=$(printf '%s\n' "$OUT" | grep -oE 'migration repair --status reverted [0-9 ]+' | head -1 | sed 's/.*reverted //')
          if [ -z "$ORPHANS" ]; then
            echo "No se pudieron extraer versiones huérfanas del error; abortando." >&2
            exit 1
          fi
          echo "Versiones huérfanas (aplicadas fuera de banda vía MCP) a reparar: $ORPHANS"
          supabase migration repair --status reverted $ORPHANS --db-url "$SUPABASE_DB_URL"
          supabase db push --include-all --db-url "$SUPABASE_DB_URL"
