name: Deploy DB Migrations (Supabase)

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

concurrency:
  group: production-db-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Migrations (Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Reparar historial remoto (versiones aplicadas fuera de banda vía MCP)
        run: |
          ORPHANS=$(supabase migration list --db-url "$SUPABASE_DB_URL" \
            | awk -F'|' '{gsub(/[[:space:]]/,"",$1); gsub(/[[:space:]]/,"",$2)} NF>=2 && $1=="" && $2 ~ /^[0-9]+$/ {printf "%s ", $2}')
          if [ -n "$ORPHANS" ]; then
            echo "Versiones huérfanas (remotas sin archivo local) a reparar: $ORPHANS"
            supabase migration repair --status reverted $ORPHANS --db-url "$SUPABASE_DB_URL"
          else
            echo "Sin versiones huérfanas en el historial remoto."
          fi

      - name: Push migrations
        run: supabase db push --include-all --db-url "$SUPABASE_DB_URL"
