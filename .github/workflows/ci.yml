name: CI

# El pre-push local corre lint, typecheck, test y format. CI corre los mismos
# gates en un runner limpio de GitHub (ubuntu-latest) para bloquear merges
# cuando alguna verificación falla.

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Instalar pnpm
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "pnpm@$version"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Instalar pnpm
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "pnpm@$version"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Instalar pnpm
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "pnpm@$version"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Run Vitest
        run: pnpm test

  db-test:
    name: DB Migration Test (postgis 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Imagen con PostGIS: las migraciones de humedales requieren la extensión.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Instalar pnpm
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "pnpm@$version"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      # Aplica las migraciones + la migración demo generada sobre un postgis 17 aislado
      # y verifica idempotencia, filtros de marketplace, limpieza y reset (#45).
      - name: Test de integración de migraciones
        run: pnpm test:db

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Instalar pnpm
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "pnpm@$version"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  audit:
    name: Audit (pnpm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Instalar pnpm
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "pnpm@$version"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit (prod, high)
        run: pnpm audit --prod --audit-level high

  contracts:
    name: Contracts (cargo test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Run contract tests
        working-directory: contracts
        run: cargo test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test, format]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - name: Instalar pnpm
        run: |
          version=$(node -p 'require("./package.json").packageManager.split("@")[1]')
          npm install --global "pnpm@$version"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      # Si el build necesita variables NEXT_PUBLIC_*, definilas como Repository
      # variables (Settings -> Secrets and variables -> Actions -> Variables)
      # y mapealas en un `env:` de este step.
      - run: pnpm build
